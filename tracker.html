<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<!-- Tracker는 index.html처럼 폴더 주소를 쓰도록 tracker/ 로 옮겼다.
     예전 주소(tracker.html)를 눌러도 새 주소로 넘어가게 남겨 둔다. -->
<meta http-equiv="refresh" content="0; url=tracker/" />
<link rel="canonical" href="tracker/" />
<title>Tracker — 주소가 바뀌었습니다</title>
<style>
  body { font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
         background: #f4f4f4; color: #161616; display: flex; height: 100vh;
         align-items: center; justify-content: center; margin: 0; }
  div { text-align: center; font-size: 14px; line-height: 1.9; }
  a { color: #0f62fe; }
</style>
</head>
<body>
<div>
  Tracker 주소가 <b>tracker/</b> 로 바뀌었습니다.<br />
  자동으로 넘어가지 않으면 <a href="tracker/">여기를 눌러주세요</a>.
</div>
<script>location.replace('tracker/');</script>
</body>
</html>
