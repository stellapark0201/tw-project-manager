<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tracker</title>

<!-- index.html과 같은 Firebase 프로젝트를 쓴다. 설정은 store.js 안에 있다. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #f4f4f4;
    --surface: #ffffff;
    --surface-2: #f8f8f8;
    --border: #e0e0e0;
    --border-subtle: #ebebeb;
    --text-primary: #161616;
    --text-secondary: #6f6f6f;
    --text-muted: #a8a8a8;
    --accent: #0f62fe;
    --accent-light: #edf3ff;
    --header-bg: #161616;
    --green: #198038;
    --red: #da1e28;
    --red-light: #fff1f1;
    --amber: #b45309;
    --shadow-lg: 0 8px 28px rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-primary);
    font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 13px;
  }

  header {
    background: var(--header-bg); color: #fff;
    padding: 0 22px; height: 46px;
    display: flex; align-items: center; gap: 14px;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  header .doc { font-size: 11px; color: rgba(255,255,255,0.45); }
  header .spacer { flex: 1; }
  #syncStatus { font-size: 11.5px; color: rgba(255,255,255,0.75); }
  #syncStatus.ok   { color: #6ee7a8; }
  #syncStatus.warn { color: #fbbf24; }
  #syncStatus.err  { color: #fca5a5; }
  .mode-btn {
    font-family: inherit; font-size: 11px; cursor: pointer;
    background: transparent; color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 11px; padding: 3px 10px;
  }
  .mode-btn.on { background: #f59e0b; border-color: #f59e0b; color: #161616; font-weight: 600; }

  .container { max-width: 1180px; margin: 0 auto; padding: 22px; }

  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .btn {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    background: var(--surface); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
    display: inline-flex; align-items: center; gap: 5px; transition: all 0.12s;
  }
  .btn:hover:not(:disabled) { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #0043ce; border-color: #0043ce; color: #fff; }
  .btn.danger { color: var(--red); }
  .btn.danger:hover:not(:disabled) { background: var(--red-light); border-color: var(--red); color: var(--red); }

  #search {
    font-family: inherit; font-size: 12.5px; padding: 6px 10px; width: 200px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
  }
  #search:focus { outline: none; border-color: var(--accent); }

  .chips { display: flex; gap: 4px; margin-left: auto; }
  .chip {
    font-family: inherit; font-size: 11.5px; cursor: pointer;
    padding: 4px 11px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--header-bg); color: #fff;
    font-size: 11.5px; font-weight: 500; text-align: left;
    padding: 9px 10px; white-space: nowrap;
  }
  tbody td { border-bottom: 1px solid var(--border-subtle); padding: 0 4px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.sel { background: var(--accent-light); }
  tbody tr.done .cell-input { color: var(--text-muted); text-decoration: line-through; }

  .cell-input, .cell-select {
    font-family: inherit; font-size: 12.5px; color: var(--text-primary);
    width: 100%; border: 1px solid transparent; border-radius: 4px;
    padding: 7px 6px; background: transparent;
  }
  .cell-input:hover, .cell-select:hover { border-color: var(--border); }
  .cell-input:focus, .cell-select:focus { outline: none; border-color: var(--accent); background: #fff; }
  .cell-select { cursor: pointer; }

  td.chk { width: 36px; text-align: center; }
  td.chk input { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  .col-name { width: 26%; } .col-owner { width: 12%; }
  .col-status { width: 104px; } .col-due { width: 128px; }

  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .empty { padding: 42px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .count { font-size: 11.5px; color: var(--text-muted); margin: 9px 2px 0; }

  /* ── 상세 패널 ── */
  #panel {
    position: fixed; top: 0; right: 0; width: 380px; height: 100%;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg); padding: 20px; overflow-y: auto;
    transform: translateX(100%); transition: transform 0.18s ease; z-index: 50;
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  #panel .sub { font-size: 11px; color: var(--text-muted); margin-bottom: 18px; }
  #panel label { display: block; font-size: 11px; color: var(--text-muted); margin: 0 0 4px; }
  #panel .field { margin-bottom: 14px; }
  #panel input, #panel select, #panel textarea {
    font-family: inherit; font-size: 13px; width: 100%;
    border: 1px solid var(--border); border-radius: 5px; padding: 7px 9px; background: var(--surface);
  }
  #panel input:focus, #panel select:focus, #panel textarea:focus { outline: none; border-color: var(--accent); }
  #panel textarea { resize: vertical; min-height: 96px; }
  .panel-head { display: flex; align-items: flex-start; gap: 8px; }
  .panel-close {
    background: none; border: none; cursor: pointer; color: var(--text-muted);
    font-size: 20px; line-height: 1; padding: 0 2px; margin-left: auto;
  }
  .panel-close:hover { color: var(--text-primary); }
  .panel-foot { border-top: 1px solid var(--border-subtle); padding-top: 14px; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>Tracker</h1>
  <span class="doc" id="docPath"></span>
  <span class="spacer"></span>
  <span id="syncStatus">연결 중...</span>
  <button class="mode-btn" id="modeBtn" onclick="toggleMode()" title="테스트 모드에서는 Firebase에 저장되지 않습니다">테스트</button>
</header>

<div class="container">
  <div class="toolbar">
    <button class="btn primary" onclick="addRow()">＋ 추가</button>
    <button class="btn danger" id="delBtn" onclick="deleteSelected()" disabled>선택 삭제</button>
    <input id="search" type="search" placeholder="검색" oninput="render()" />
    <div class="chips" id="statusChips"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="chk"><input type="checkbox" id="chkAll" onclick="toggleAll(this.checked)" /></th>
          <th class="col-name">항목</th>
          <th class="col-owner">담당</th>
          <th class="col-status">상태</th>
          <th class="col-due">기한</th>
          <th>비고</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">아직 항목이 없습니다. ＋ 추가를 눌러 시작하세요.</div>
  </div>
  <div class="count" id="countMsg"></div>
</div>

<!-- 행을 클릭하면 열리는 상세 패널 -->
<div id="panel">
  <div class="panel-head">
    <div>
      <h2 id="pTitle">항목</h2>
      <div class="sub" id="pMeta"></div>
    </div>
    <button class="panel-close" onclick="closePanel()" title="닫기">×</button>
  </div>
  <div class="field"><label>항목</label><input id="pName" /></div>
  <div class="field"><label>담당</label><input id="pOwner" /></div>
  <div class="field"><label>상태</label><select id="pStatus"></select></div>
  <div class="field"><label>기한</label><input id="pDue" type="date" /></div>
  <div class="field"><label>비고</label><input id="pNote" /></div>
  <div class="field"><label>메모</label><textarea id="pMemo" placeholder="자유롭게 입력하세요"></textarea></div>
  <div class="panel-foot">
    <button class="btn danger" onclick="deleteCurrent()">이 항목 삭제</button>
  </div>
</div>

<script src="store.js"></script>
<script>
/* 화면만 담당한다. 저장·동기화는 전부 store.js가 한다.
   열을 바꾸려면 COLUMNS 비슷한 자리(여기 render와 패널)만 고치면 되고
   store.js는 건드릴 필요가 없다. */

const STATUSES = ['대기', '진행', '완료', '보류'];
const STATUS_COLOR = {
  '대기': ['#f1f5f9', '#64748b'],
  '진행': ['#edf3ff', '#0f62fe'],
  '완료': ['#defbe6', '#198038'],
  '보류': ['#fff1f1', '#da1e28']
};

let filter = '';          // 상태 필터 ('' = 전체)
let openId = null;        // 상세 패널에 띄운 행
const selected = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ── 목록 ──────────────────────────────────────────────────────────── */
function visibleRows() {
  const q = $('search').value.trim().toLowerCase();
  return Store.all().filter(r => {
    if (filter && (r.status || '대기') !== filter) return false;
    if (!q) return true;
    return ['name', 'owner', 'status', 'due', 'note', 'memo']
      .some(k => String(r[k] || '').toLowerCase().includes(q));
  });
}

function render() {
  const list = visibleRows();
  const tbody = $('tbody');

  tbody.innerHTML = list.map(r => {
    const st = r.status || '대기';
    const [bg, fg] = STATUS_COLOR[st] || STATUS_COLOR['대기'];
    return `<tr data-id="${r.id}" class="${selected.has(r.id) ? 'sel' : ''} ${st === '완료' ? 'done' : ''}"
             onclick="openPanel('${r.id}')">
      <td class="chk" onclick="event.stopPropagation()">
        <input type="checkbox" ${selected.has(r.id) ? 'checked' : ''}
               onchange="toggleSelect('${r.id}', this.checked)" /></td>
      <td onclick="event.stopPropagation()"><input class="cell-input" value="${esc(r.name)}"
             placeholder="제목" onblur="edit('${r.id}','name',this.value)"
             onkeydown="if(event.key==='Enter')this.blur()" /></td>
      <td onclick="event.stopPropagation()"><input class="cell-input" value="${esc(r.owner)}"
             onblur="edit('${r.id}','owner',this.value)"
             onkeydown="if(event.key==='Enter')this.blur()" /></td>
      <td onclick="event.stopPropagation()">
        <select class="cell-select" style="background:${bg};color:${fg};font-weight:500;"
                onchange="edit('${r.id}','status',this.value)">
          ${STATUSES.map(s => `<option ${s === st ? 'selected' : ''}>${s}</option>`).join('')}
        </select></td>
      <td onclick="event.stopPropagation()"><input class="cell-input" type="date" value="${esc(r.due)}"
             onchange="edit('${r.id}','due',this.value)" /></td>
      <td onclick="event.stopPropagation()"><input class="cell-input" value="${esc(r.note)}"
             onblur="edit('${r.id}','note',this.value)"
             onkeydown="if(event.key==='Enter')this.blur()" /></td>
    </tr>`;
  }).join('');

  $('emptyMsg').style.display = list.length ? 'none' : '';
  const total = Store.count();
  $('countMsg').textContent = list.length === total
    ? `${total}개` : `${list.length}개 표시 / 전체 ${total}개`;

  $('delBtn').disabled = selected.size === 0;
  $('delBtn').textContent = selected.size ? `선택 삭제 (${selected.size})` : '선택 삭제';
  const all = list.length > 0 && list.every(r => selected.has(r.id));
  $('chkAll').checked = all;
  $('chkAll').indeterminate = !all && list.some(r => selected.has(r.id));

  renderChips();
  if (openId && !Store.get(openId)) closePanel();      // 팀원이 지웠으면 패널도 닫는다
  else if (openId) fillPanel(Store.get(openId));
}

function renderChips() {
  const counts = {};
  Store.all().forEach(r => { const s = r.status || '대기'; counts[s] = (counts[s] || 0) + 1; });
  $('statusChips').innerHTML =
    [['', '전체', Store.count()]].concat(STATUSES.map(s => [s, s, counts[s] || 0]))
      .map(([v, label, n]) =>
        `<button class="chip ${filter === v ? 'on' : ''}" onclick="setFilter('${v}')">${label} ${n}</button>`)
      .join('');
}
function setFilter(v) { filter = v; render(); }

/* ── 편집 ──────────────────────────────────────────────────────────── */
function edit(id, field, value) { Store.setField(id, field, value); }

function addRow() {
  const r = Store.add({ name: '', owner: '', status: '대기', due: '', note: '', memo: '' });
  render();
  const el = document.querySelector(`tr[data-id="${r.id}"] .cell-input`);
  if (el) el.focus();
}

function toggleSelect(id, on) {
  if (on) selected.add(id); else selected.delete(id);
  render();
}
function toggleAll(on) {
  visibleRows().forEach(r => { if (on) selected.add(r.id); else selected.delete(r.id); });
  render();
}
function deleteSelected() {
  const ids = [...selected];
  if (!ids.length) return;
  const names = ids.map(id => (Store.get(id) || {}).name || '(제목 없음)').join(', ');
  if (!confirm(`${ids.length}개를 삭제합니다 — ${names}`)) return;
  Store.remove(ids);
  selected.clear();
  if (openId && ids.includes(openId)) closePanel();
  render();
}

/* ── 상세 패널 ─────────────────────────────────────────────────────── */
function openPanel(id) {
  const r = Store.get(id);
  if (!r) return;
  openId = id;
  fillPanel(r);
  $('panel').classList.add('open');
}
function fillPanel(r) {
  if (!r) return;
  const focused = document.activeElement;
  const set = (el, v) => { if (el !== focused) el.value = v || ''; };   // 입력 중인 칸은 건드리지 않는다
  $('pTitle').textContent = r.name || '(제목 없음)';
  $('pMeta').textContent = `수정 ${(r.updatedAt || '').replace('T', ' ').slice(0, 16)}`;
  set($('pName'), r.name); set($('pOwner'), r.owner); set($('pStatus'), r.status || '대기');
  set($('pDue'), r.due);   set($('pNote'), r.note);   set($('pMemo'), r.memo);
}
function closePanel() { openId = null; $('panel').classList.remove('open'); }
function deleteCurrent() {
  if (!openId) return;
  const r = Store.get(openId);
  if (!confirm(`삭제합니다 — ${(r && r.name) || '(제목 없음)'}`)) return;
  Store.remove(openId);
  selected.delete(openId);
  closePanel();
  render();
}
// 패널의 각 칸을 행의 필드에 묶는다 (칸에서 빠져나오거나 값을 고르면 저장)
function bindPanelFields() {
  [['pName', 'name'], ['pOwner', 'owner'], ['pStatus', 'status'],
   ['pDue', 'due'], ['pNote', 'note'], ['pMemo', 'memo']].forEach(([elId, field]) => {
    const el = $(elId);
    const ev = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'blur';
    el.addEventListener(ev, () => {
      if (!openId) return;
      Store.setField(openId, field, el.value);
      render();
    });
  });
}

/* ── 테스트 모드 ───────────────────────────────────────────────────── */
function toggleMode() {
  const on = !Store.isTestMode();
  if (on && !confirm('테스트 모드로 바꿉니다. 이 브라우저에만 저장되고 팀에는 올라가지 않습니다.')) return;
  Store.setTestMode(on);
  paintMode();
}
function paintMode() {
  const on = Store.isTestMode();
  $('modeBtn').classList.toggle('on', on);
  $('modeBtn').textContent = on ? '테스트 모드' : '테스트';
}

/* ── 시작 ──────────────────────────────────────────────────────────── */
Store.on('change', render);
Store.on('status', (text, tone) => {
  const el = $('syncStatus');
  el.textContent = text;
  el.className = tone;
});

window.addEventListener('DOMContentLoaded', () => {
  $('docPath').textContent = Store.DOC_PATH;
  $('pStatus').innerHTML = STATUSES.map(s => `<option>${s}</option>`).join('');
  bindPanelFields();
  paintMode();
  Store.init();
});
</script>
</body>
</html>
